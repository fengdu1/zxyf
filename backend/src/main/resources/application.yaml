spring:
  application:
    name: zxyf-sys
  config:
    import: optional:file:./secrets.yaml
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://mysql:3306/zxyf?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: ${ZXYF_DB_PASSWORD}
  servlet:
    multipart:
      max-file-size: 10MB      # 单个文件最大体积，按需调整
      max-request-size: 20MB   # 单次请求总大小，需 >= 单文件最大体积

server:
  port: 8090

jwt:
  # JWT 签名密钥与令牌有效期（小时）
  secret: ${ZXYF_JWT_SECRET}
  expire-hours: 12

oss:
  # 阿里云 OSS 配置（@ConfigurationProperties 注入）
  endpoint: https://oss-cn-beijing.aliyuncs.com/
  access-key-id: ${ZXYF_OSS_ACCESS_KEY_ID}
  access-key-secret: ${ZXYF_OSS_ACCESS_KEY_SECRET}
  bucket-name: zxyf-feng