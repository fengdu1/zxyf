name: Build and Release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write    # 必需，允许创建 Release

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ===== 后端构建 =====
      - name: Setup JDK 26
        uses: actions/setup-java@v4
        with:
          java-version: '26'
          distribution: 'temurin'
          cache: maven

      - name: Build backend jar
        working-directory: ./backend
        run: mvn clean package -DskipTests

      # ===== 前端构建 =====
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: ./frontend
        run: |
          npm ci
          npm run build

      # ===== 打包构建产物 =====
      - name: Prepare artifacts
        run: |
          mkdir -p release
          cp backend/target/zxyf-sys-0.0.1-SNAPSHOT.jar release/
          cd frontend && tar -czf ../release/frontend-dist.tar.gz dist/
          cd ..
          ls -lh release/

      # ===== 创建 GitHub Release =====
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Release v${{ github.run_number }}
          body: |
            自动构建版本 v${{ github.run_number }}
            Commit: ${{ github.sha }}
            触发: ${{ github.event.head_commit.message }}
          files: |
            release/zxyf-sys-0.0.1-SNAPSHOT.jar
            release/frontend-dist.tar.gz
          draft: false
          prerelease: false